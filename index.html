<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="李奥运 · 河南牧业经济学院智能制造专业 · 个人简历">
<meta name="theme-color" content="#4f46e5">
<title>李奥运 · 个人简历</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('resume-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
/* ============ Design Tokens ============ */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --text: #131a2b;
  --text-2: #5b657a;
  --text-3: #8b95a9;
  --border: rgba(19, 26, 43, .10);
  --border-strong: rgba(19, 26, 43, .18);
  --primary: #4f46e5;
  --primary-ink: #4f46e5;
  --primary-soft: rgba(79, 70, 229, .10);
  --accent: #06b6d4;
  --accent-ink: #0e7490;
  --accent-soft: rgba(6, 182, 212, .12);
  --grad: linear-gradient(120deg, #4f46e5 0%, #7c3aed 48%, #06b6d4 100%);
  --glow-1: rgba(79, 70, 229, .16);
  --glow-2: rgba(6, 182, 212, .14);
  --shadow-sm: 0 1px 2px rgba(19, 26, 43, .05), 0 2px 8px rgba(19, 26, 43, .05);
  --shadow-md: 0 8px 24px rgba(19, 26, 43, .09), 0 2px 6px rgba(19, 26, 43, .05);
  --shadow-lg: 0 20px 44px rgba(19, 26, 43, .14);
  --nav-bg: rgba(244, 246, 251, .82);
  --radius: 16px;
}

[data-theme="dark"] {
  --bg: #0b0f1a;
  --surface: #131a2b;
  --surface-2: #0e1422;
  --text: #e9eef8;
  --text-2: #a3aec5;
  --text-3: #717d95;
  --border: rgba(255, 255, 255, .10);
  --border-strong: rgba(255, 255, 255, .20);
  --primary: #818cf8;
  --primary-ink: #a5b4fc;
  --primary-soft: rgba(129, 140, 248, .14);
  --accent: #22d3ee;
  --accent-ink: #67e8f9;
  --accent-soft: rgba(34, 211, 238, .14);
  --grad: linear-gradient(120deg, #818cf8 0%, #a78bfa 48%, #22d3ee 100%);
  --glow-1: rgba(99, 102, 241, .20);
  --glow-2: rgba(34, 211, 238, .14);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-md: 0 10px 26px rgba(0, 0, 0, .45);
  --shadow-lg: 0 22px 50px rgba(0, 0, 0, .55);
  --nav-bg: rgba(11, 15, 26, .82);
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 78px;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", system-ui, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background-color .3s ease, color .3s ease;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(760px 480px at 6% -10%, var(--glow-1), transparent 68%),
    radial-gradient(640px 440px at 98% 0%, var(--glow-2), transparent 68%);
}

main, footer { position: relative; z-index: 1; }

::selection { background: var(--primary-soft); color: var(--primary-ink); }

a { color: var(--primary-ink); }

.container {
  width: min(1080px, calc(100% - 40px));
  margin-inline: auto;
}

@media (max-width: 640px) {
  .container { width: calc(100% - 28px); }
}

/* ============ Nav ============ */
.nav {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 60;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(16px) saturate(1.6);
  backdrop-filter: blur(16px) saturate(1.6);
  border-bottom: 1px solid var(--border);
  transition: background-color .3s ease, border-color .3s ease;
}

.nav-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 60px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: -.02em;
  color: var(--text);
  text-decoration: none;
  flex-shrink: 0;
}

.brand-dot {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--grad);
  display: grid;
  place-items: center;
  color: #fff;
  font-size: .82rem;
  font-weight: 800;
  box-shadow: 0 4px 12px -4px rgba(79, 70, 229, .7);
}

.nav-links {
  display: flex;
  gap: 2px;
  margin-left: auto;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 2px 0;
}

.nav-links::-webkit-scrollbar { display: none; }

.nav-link {
  padding: 7px 12px;
  border-radius: 9px;
  font-size: .86rem;
  font-weight: 500;
  color: var(--text-2);
  text-decoration: none;
  white-space: nowrap;
  transition: background-color .18s ease, color .18s ease;
}

.nav-link:hover { color: var(--text); background: var(--primary-soft); }
.nav-link.active { color: var(--primary-ink); background: var(--primary-soft); font-weight: 700; }

.nav-actions { display: flex; gap: 8px; flex-shrink: 0; }

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  transition: transform .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.icon-btn:hover {
  color: var(--primary-ink);
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.icon-btn svg { display: block; }

#themeToggle span { display: none; }
#themeToggle .icon-sun { display: grid; }
[data-theme="dark"] #themeToggle .icon-sun { display: none; }
[data-theme="dark"] #themeToggle .icon-moon { display: grid; }

@media (max-width: 720px) {
  .brand span:not(.brand-dot) { display: none; }
  .nav-link { padding: 6px 9px; font-size: .8rem; }
  .nav-inner { gap: 8px; }
}

/* ============ Sections ============ */
section { padding: 58px 0; }

.section-head { margin-bottom: 26px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 0 0 6px;
  font-size: 1.42rem;
  font-weight: 800;
  letter-spacing: -.02em;
}

.section-title::before {
  content: "";
  width: 6px;
  height: 22px;
  border-radius: 4px;
  background: var(--grad);
  flex-shrink: 0;
}

.section-sub {
  margin: 0;
  font-size: .88rem;
  color: var(--text-2);
  padding-left: 17px;
}

/* ============ Hero ============ */
.hero { padding: 128px 0 52px; }

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 48px;
  align-items: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 12px;
  padding: 5px 13px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border: 1px solid transparent;
}

.name {
  margin: 0 0 10px;
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1.15;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-sub {
  margin: 0 0 16px;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-2);
}

.hero-summary {
  margin: 0 0 20px;
  font-size: .93rem;
  line-height: 1.85;
  color: var(--text-2);
  max-width: 62ch;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border-radius: 999px;
  font-size: .79rem;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  transition: transform .18s ease, border-color .18s ease, color .18s ease;
}

.badge:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  color: var(--primary-ink);
}

.badge-sm { font-size: .72rem; padding: 3px 10px; }

.cta-row { display: flex; flex-wrap: wrap; gap: 10px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: .88rem;
  font-weight: 600;
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform .18s ease, box-shadow .18s ease, color .18s ease,
    border-color .18s ease, background-color .18s ease;
  white-space: nowrap;
}

.btn svg { flex-shrink: 0; }

.btn-primary {
  background: var(--grad);
  color: #fff;
  box-shadow: 0 8px 20px -8px rgba(79, 70, 229, .8);
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px rgba(79, 70, 229, .9); }

.btn-ghost {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text);
}

.btn-ghost:hover {
  border-color: var(--primary);
  color: var(--primary-ink);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.hero-right {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.avatar-wrap {
  width: 176px;
  height: 176px;
  border-radius: 50%;
  padding: 4px;
  background: var(--grad);
  box-shadow: 0 22px 46px -18px rgba(79, 70, 229, .85);
}

.avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--surface);
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 3.1rem;
  font-weight: 800;
  letter-spacing: .04em;
  background-clip: padding-box;
  color: var(--primary-ink);
}

.avatar-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
  align-items: center;
}

.hero-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .78rem;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 5px 13px;
  border-radius: 999px;
  white-space: nowrap;
}

@media (max-width: 880px) {
  .hero { padding: 108px 0 40px; }
  .hero-grid { grid-template-columns: 1fr; gap: 30px; }
  .hero-right { order: -1; flex-direction: row; gap: 18px; align-items: center; }
  .hero-meta { margin-top: 0; align-items: flex-start; }
  .avatar-wrap { width: 104px; height: 104px; }
  .avatar-inner { font-size: 1.9rem; }
}

@media (max-width: 480px) {
  .hero-right { flex-direction: column; align-items: flex-start; }
  .hero-meta { flex-direction: row; flex-wrap: wrap; margin-top: 4px; }
}

/* ============ Cards / Stats ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(186px, 1fr));
  gap: 16px;
}

.stat {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.stat:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

.stat::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: var(--grad);
  opacity: 0;
  transition: opacity .2s ease;
}

.stat:hover::after { opacity: 1; }

.stat-num {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1.2;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-variant-numeric: tabular-nums;
}

.stat-label { margin-top: 6px; font-size: .9rem; font-weight: 700; }

.stat-desc { margin-top: 4px; font-size: .77rem; line-height: 1.55; color: var(--text-3); }

/* ============ Tabs ============ */
.tabs {
  display: flex;
  gap: 5px;
  padding: 5px;
  margin-bottom: 22px;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  padding: 8px 18px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-family: inherit;
  font-size: .86rem;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
}

.tab:hover { color: var(--text); }

.tab[aria-selected="true"] {
  background: var(--surface);
  color: var(--primary-ink);
  box-shadow: var(--shadow-sm);
}

.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.tabpanel { animation: fadeUp .32s cubic-bezier(.22, .85, .28, 1) both; }
.tabpanel:focus { outline: none; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ============ Timeline / Experience ============ */
.timeline { position: relative; padding-left: 24px; }

.timeline::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  opacity: .28;
}

.tl-item { position: relative; margin-bottom: 18px; }
.tl-item:last-child { margin-bottom: 0; }

.tl-item::before {
  content: "";
  position: absolute;
  left: -24px;
  top: 26px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 2.5px solid var(--primary);
  box-shadow: 0 0 0 4px var(--primary-soft);
}

.item-head {
  display: flex;
  gap: 14px;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
}

.item-title { margin: 0; font-size: 1.02rem; font-weight: 700; letter-spacing: -.015em; }

.item-org { margin: 3px 0 0; font-size: .84rem; color: var(--text-2); }

.item-period {
  flex-shrink: 0;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.points {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
}

.points li {
  position: relative;
  padding-left: 18px;
  margin-bottom: 8px;
  font-size: .875rem;
  line-height: 1.8;
  color: var(--text-2);
}

.points li:last-child { margin-bottom: 0; }

.points li::before {
  content: "";
  position: absolute;
  left: 1px;
  top: .72em;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--grad);
  transform: rotate(45deg);
}

/* ============ Projects ============ */
.proj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}

.proj-top {
  display: flex;
  gap: 14px;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
}

.proj-title { margin: 0; font-size: 1.02rem; font-weight: 700; letter-spacing: -.015em; }

.proj-sub { margin: 6px 0 0; font-size: .82rem; color: var(--text-3); }

.proj-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

.chip {
  padding: 3px 10px;
  border-radius: 7px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .01em;
  color: var(--accent-ink);
  background: var(--accent-soft);
}

/* ============ Skills ============ */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(288px, 1fr));
  gap: 16px;
}

.skill-card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: -.01em;
}

.skill-card-title .dot {
  width: 8px;
  height: 8px;
  border-radius: 3px;
  background: var(--grad);
  flex-shrink: 0;
}

.skill-row { margin-bottom: 14px; }
.skill-row:last-child { margin-bottom: 0; }

.skill-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
  font-size: .84rem;
}

.skill-name { color: var(--text); font-weight: 500; }

.skill-pct {
  font-size: .75rem;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.bar {
  height: 7px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: var(--grad);
  transition: width .9s cubic-bezier(.22, .85, .28, 1);
}

/* ============ Certificates ============ */
.cert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
  gap: 12px;
}

.cert {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.cert:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

.cert-icon {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--primary-soft);
  color: var(--primary-ink);
}

.cert-name { font-size: .86rem; font-weight: 600; line-height: 1.5; }

.cert-meta { margin-top: 3px; font-size: .74rem; color: var(--text-3); }

/* ============ Cert Photos ============ */
.cert-photos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-top: 18px;
}

.cert-photo {
  margin: 0;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.cert-photo:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

.cert-photo img {
  width: 100%;
  height: auto;
  max-height: 260px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: block;
  background: var(--surface-2);
}

.cert-photo figcaption {
  font-size: .78rem;
  color: var(--text-3);
  text-align: center;
}

/* ============ Footer ============ */
footer {
  border-top: 1px solid var(--border);
  padding: 32px 0;
  text-align: center;
  font-size: .8rem;
  color: var(--text-3);
}

footer p { margin: 0 0 4px; }

/* ============ To Top ============ */
.to-top {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 50;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  box-shadow: var(--shadow-md);

  /* =========================================================
     渲染：Hero
     ========================================================= */
  function renderHero() {
    const root = document.getElementById('heroContent');
    const grid = el('div', { class: 'hero-grid' });
    const left = el('div', { class: 'hero-left reveal' });

    left.appendChild(el('p', {
      class: 'eyebrow',
      text: resume.status + ' · ' + resume.period.split('–')[0].trim() + ' 入学'
    }));

    left.appendChild(el('h1', { class: 'name', text: resume.name }));

    left.appendChild(el('p', {
      class: 'hero-sub',
      text: resume.school + ' · ' + resume.major
    }));

    left.appendChild(el('p', { class: 'hero-summary', text: resume.summary }));

    const badges = el('div', { class: 'badges' });
    resume.keywords.forEach(function (k) {
      badges.appendChild(el('span', { class: 'badge', text: k }));
    });
    left.appendChild(badges);

    /* CTA */
    const cta = el('div', { class: 'cta-row' });

    cta.appendChild(el('a', {
      class: 'btn btn-primary',
      attrs: { href: 'tel:' + resume.phone }
    }, [icon('phone', 16), textNode(resume.phone)]));

    if (fullEmail) {
      const copyBtn = el('button', {
        class: 'btn btn-ghost',
        attrs: { type: 'button', id: 'copyEmailBtn' }
      }, [icon('mail', 16), textNode('复制邮箱')]);

      copyBtn.addEventListener('click', function () {
        const mail = [resume.emailUser, resume.emailDomain].join('@');
        const done = function () {
          copyBtn.textContent = '';
          copyBtn.appendChild(icon('check', 16));
          copyBtn.appendChild(textNode('已复制'));
          setTimeout(function () {
            copyBtn.textContent = '';
            copyBtn.appendChild(icon('mail', 16));
            copyBtn.appendChild(textNode('复制邮箱'));
          }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(mail).then(done).catch(fallback);
        } else {
          fallback();
        }
        function fallback() {
          const ta = document.createElement('textarea');
          ta.value = mail;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
          document.body.removeChild(ta);
        }
      });

      cta.appendChild(copyBtn);
    }

    const printBtn = el('button', {
      class: 'btn btn-ghost',
      attrs: { type: 'button' }
    }, [icon('print', 16), textNode('打印 / 保存 PDF')]);
    printBtn.addEventListener('click', function () { window.print(); });
    cta.appendChild(printBtn);

    left.appendChild(cta);

    /* 右侧头像 */
    const right = el('div', { class: 'hero-right reveal' });
    right.appendChild(el('div', { class: 'avatar-wrap' }, [
      el('div', { class: 'avatar-inner' }, [
        el('img', {
          attrs: {
            src: 'a.jpg',
            alt: resume.name + ' 头像',
            loading: 'lazy'
          }
        })
      ])
    ]));

    const meta = el('div', { class: 'hero-meta' });
    meta.appendChild(el('span', { class: 'hero-meta-item' }, [icon('pin', 13), textNode(resume.location)]));
    meta.appendChild(el('span', { class: 'hero-meta-item' }, [icon('cap', 13), textNode(resume.period.split('–')[0].trim() + ' 入学')]));
    right.appendChild(meta);

    grid.appendChild(left);
    grid.appendChild(right);
    root.appendChild(grid);
  }

  /* =========================================================
     渲染：经历（Tabs）

  function renderExpItem(item) {

  function renderExperience() {
    const tabsEl = document.getElementById('expTabs');
    const panelsEl = document.getElementById('expPanels');

    const groups = [
      { id: 'intern', label: '实习与实战', items: resume.experiences.filter(function (e) { return e.category === 'intern'; }) },
      { id: 'campus', label: '校园经历', items: resume.experiences.filter(function (e) { return e.category === 'campus'; }) }
    ].filter(function (g) { return g.items.length > 0; });

        }
      }));

        class: 'tabpanel',
        attrs: {
          role: 'tabpanel',
          id: panelId,
          'aria-labelledby': tabId,

  /* =========================================================
     Tabs 交互（ARIA + 键盘左右切换）
     ========================================================= */
  function initTablist(listEl) {
    const tabs = Array.prototype.slice.call(listEl.querySelectorAll('[role="tab"]'));

    function activate(idx, focus) {
      tabs.forEach(function (t, i) {
        const selected = i === idx;
        t.setAttribute('aria-selected', selected ? 'true' : 'false');
        t.tabIndex = selected ? 0 : -1;
        const panel = document.getElementById(t.getAttribute('aria-controls'));
        if (panel) panel.hidden = !selected;
      });
      if (focus) tabs[idx].focus();
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { activate(i, false); });

      tab.addEventListener('keydown', function (e) {
        let next = null;
        if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = tabs.length - 1;
        if (next !== null) {
          e.preventDefault();
          activate(next, true);
        }
      });
    });
  }

  /* =========================================================
     渲染：技能矩阵
     ========================================================= */
  function renderSkills() {
    const grid = document.getElementById('skillsGrid');

    resume.skills.forEach(function (group) {
      const card = el('div', { class: 'card reveal' });

      const title = el('h3', { class: 'skill-card-title' });
      title.appendChild(el('span', { class: 'dot' }));
      title.appendChild(textNode(group.group));
      card.appendChild(title);

      group.items.forEach(function (item) {
        const row = el('div', { class: 'skill-row' });

        const top = el('div', { class: 'skill-top' });
        top.appendChild(el('span', { class: 'skill-name', text: item.name }));
        top.appendChild(el('span', { class: 'skill-pct', text: item.level + '%' }));
        row.appendChild(top);

        const bar = el('div', { class: 'bar' });
        const fill = el('div', {
          class: 'bar-fill',
          attrs: {
            role: 'progressbar',
            'aria-label': item.name,
            'aria-valuenow': String(item.level),
            'aria-valuemin': '0',
            'aria-valuemax': '100'
          }
        });
        fill.dataset.level = String(item.level);
        bar.appendChild(fill);
        row.appendChild(bar);

        card.appendChild(row);
      });

      grid.appendChild(card);
    });
  }

  function animateBars() {
    const fills = document.querySelectorAll('.bar-fill');
    if (!('IntersectionObserver' in window)) {
      fills.forEach(function (f) { f.style.width = f.dataset.level + '%'; });
      return;
    }
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          const f = entry.target;
          f.style.width = f.dataset.level + '%';
          io.unobserve(f);
        }
      });
    }, { threshold: 0.25 });
    fills.forEach(function (f) { io.observe(f); });
  }

  function renderFooter() {

      now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月';

  /* =========================================================
     交互：主题切换
     ========================================================= */
  function initTheme() {
    const btn = document.getElementById('themeToggle');
    btn.addEventListener('click', function () {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('resume-theme', next); } catch (e) { /* ignore */ }
    });
  }

  /* =========================================================
     交互：打印 / 返回顶部 / 导航高亮
     ========================================================= */
  function initPrint() {
    document.getElementById('printBtn').addEventListener('click', function () {
      window.print();
    });
  }

  function initToTop() {
    const btn = document.getElementById('toTop');
    let ticking = false;

    function update() {
      const y = window.pageYOffset || document.documentElement.scrollTop;
      if (y > 420) btn.classList.add('show');
      else btn.classList.remove('show');
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });

    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    update();
  }

  function initNavSpy() {
    const links = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));
    const sections = ['highlights', 'experience', 'projects', 'skills', 'education']
      .map(function (id) { return document.getElementById(id); })
      .filter(Boolean);

    if (!('IntersectionObserver' in window) || !sections.length) return;

    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        const id = '#' + entry.target.id;
        links.forEach(function (l) {
          l.classList.toggle('active', l.getAttribute('href') === id);
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

    sections.forEach(function (s) { observer.observe(s); });
  }

  /* =========================================================
     交互：滚动淡入
     ========================================================= */
  function initReveal() {
    const nodes = document.querySelectorAll('.reveal');

    if (!('IntersectionObserver' in window)) {
      nodes.forEach(function (n) { n.classList.add('in'); });
      return;
    }

    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

    nodes.forEach(function (n, i) {
      n.style.transitionDelay = Math.min(i % 6, 5) * 45 + 'ms';
      io.observe(n);
    });
  }

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    renderNav();
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderCertificates();
    renderFooter();

    initTheme();
    initPrint();
    initToTop();
    initNavSpy();
    animateBars();

    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(initReveal);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
